[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-completion-kit"
version = "0.1.0"
description = "A unified interface for mask-aware low-rank matrix completion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["matrix_completion", "matrix_completion.algorithms"]
package-dir = {matrix_completion = "src"}
